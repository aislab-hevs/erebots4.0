services:
  erebots-api:
    command:
      [
        "/app/.venv/bin/python",
        "-m",
        "uvicorn",
        "app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "7860",
        "--reload",
        "--reload-dir",
        "/workspace",
        "--reload-include",
        "*.py",
        "--reload-include",
        "*.css",
        "--reload-include",
        "*.html",
        "--reload-exclude",
        ".git",
        "--reload-exclude",
        "__pycache__",
        "--reload-exclude",
        ".venv",
        "--reload-exclude",
        "traefik",
        "--reload-exclude",
        "keycloak",
      ]
    environment:
      PYTHONPATH: /workspace
      PYTHONDONTWRITEBYTECODE: "1"
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - .:/workspace
    working_dir: /workspace
